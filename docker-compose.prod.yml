# Sentinelle — déploiement de production (hébergeur UE).
# Démarrage : copier .env.production.example en .env puis `docker compose -f docker-compose.prod.yml up -d --build`
services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Applique les migrations une fois, puis s'arrête.
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgis:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_BASE_URL: ${API_PUBLIC_URL}
      AUTH_PROVIDER: ${AUTH_PROVIDER}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      UPLOADS_DIR: /app/uploads
      RECEIPT_ORG_NAME: ${RECEIPT_ORG_NAME}
      RECEIPT_LEGAL_MENTION: ${RECEIPT_LEGAL_MENTION}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${WEB_ORIGIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api

  # Reverse proxy + HTTPS automatique (Let's Encrypt).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pg_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
