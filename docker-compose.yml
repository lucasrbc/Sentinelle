# Sentinelle — infrastructure locale de développement.
# Démarrage : `docker compose up -d`
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sentinelle-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: sentinelle
      POSTGRES_DB: sentinelle
    ports:
      - "5432:5432"
    volumes:
      - sentinelle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle -d sentinelle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinelle-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sentinelle_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinelle_pg_data:
  sentinelle_redis_data:
